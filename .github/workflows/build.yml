name: Production Edge Pilot
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  qa:
    name: PHP Production Edge QA
    runs-on:
      group: sonar-prod
      labels: sonar-m
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          version: 2026.3.12
      - name: Isolate download homes
        shell: bash
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/php-edge-gradle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "ORCHESTRATOR_HOME=$RUNNER_TEMP/php-edge-orchestrator-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: SonarSource/vault-action-wrapper@v3
        id: licenses
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;
      - uses: SonarSource/ci-github-actions/config-gradle@34a5cd54a008a57fb8e78ca41af265ab7cba66de
        with:
          artifactory-reader-role: private-reader
          disable-caching: 'true'
          use-develocity: 'false'
      - name: Prepare private Orchestrator configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$ARTIFACTORY_RESOLVE_URL" = 'https://repox-internal.sonar.build/artifactory'
          test -n "$ARTIFACTORY_ACCESS_TOKEN"
          test ! -d "$ORCHESTRATOR_HOME"
          printf 'PILOT selected resolve URL: %s; reader: %s\n' "$ARTIFACTORY_RESOLVE_URL" "$ARTIFACTORY_READER_ROLE"
          config_dir="$RUNNER_TEMP/php-edge-private-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir -p "$config_dir"
          printf '%s\n' "orchestrator.artifactory.url=$ARTIFACTORY_RESOLVE_URL" "orchestrator.artifactory.accessToken=$ARTIFACTORY_ACCESS_TOKEN" > "$config_dir/orchestrator.properties"
          config_path="$config_dir/orchestrator.properties"
          config_uri=$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).as_uri())' "$config_path")
          echo "ORCHESTRATOR_CONFIG_URL=$config_uri" >> "$GITHUB_ENV"
          cat > "$config_dir/logback.xml" <<'LOGBACK'
          <configuration>
            <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
              <encoder><pattern>%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n</pattern></encoder>
            </appender>
            <logger name="com.sonar.orchestrator" level="INFO"/>
            <root level="WARN"><appender-ref ref="STDOUT"/></root>
          </configuration>
          LOGBACK
          echo "PILOT_LOGBACK_CONFIG=$config_dir/logback.xml" >> "$GITHUB_ENV"
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/pilot-semantics.gradle" <<'GRADLE'
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              systemProperty 'logback.configurationFile', System.getenv('PILOT_LOGBACK_CONFIG')
            }
          }
          gradle.projectsEvaluated {
            assert System.getenv('ARTIFACTORY_RESOLVE_URL') == 'https://repox-internal.sonar.build/artifactory'
            assert System.getenv('ARTIFACTORY_URL') == 'https://repox.jfrog.io/artifactory'
            println 'PILOT build resolution is production Edge; deployment URL remains SaaS'
          }
          GRADLE
      - uses: SonarSource/vault-action-wrapper@v3
        id: public_probe
        with:
          secrets: |
            development/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-public-reader username | PUBLIC_READER_USERNAME;
            development/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-public-reader access_token | PUBLIC_READER_TOKEN;
      - name: Compare production reader access
        shell: bash
        env:
          PUBLIC_READER_USERNAME: ${{ fromJSON(steps.public_probe.outputs.vault).PUBLIC_READER_USERNAME }}
          PUBLIC_READER_TOKEN: ${{ fromJSON(steps.public_probe.outputs.vault).PUBLIC_READER_TOKEN }}
        run: |
          set -euo pipefail
          module_url="$ARTIFACTORY_RESOLVE_URL/sonarsource/org/eclipse/lsp4j/org.eclipse.lsp4j.jsonrpc/1.0.0/org.eclipse.lsp4j.jsonrpc-1.0.0.module"
          zip_url="$ARTIFACTORY_RESOLVE_URL/sonarsource/com/sonarsource/sonarqube/sonarqube-enterprise-lw/2026.5.2.132813/sonarqube-enterprise-lw-2026.5.2.132813.zip"
          public_status=$(curl --silent --show-error --max-time 60 --user "$PUBLIC_READER_USERNAME:$PUBLIC_READER_TOKEN" -o /dev/null -w '%{http_code}' "$module_url")
          private_status=$(curl --silent --show-error --max-time 60 --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_ACCESS_TOKEN" -o /dev/null -w '%{http_code}' "$module_url")
          zip_status=$(curl --silent --show-error --head --max-time 60 --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_ACCESS_TOKEN" -o /dev/null -w '%{http_code}' "$zip_url")
          printf 'PILOT metadata GET: public-reader=%s private-reader=%s; private distribution HEAD=%s\n' "$public_status" "$private_status" "$zip_status"
          pom_status=$(curl --silent --show-error --max-time 60 --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_ACCESS_TOKEN" -o /dev/null -w '%{http_code}' "${module_url%.module}.pom")
          jar_status=$(curl --silent --show-error --head --max-time 60 --user "$ARTIFACTORY_USERNAME:$ARTIFACTORY_ACCESS_TOKEN" -o /dev/null -w '%{http_code}' "${module_url%.module}.jar")
          printf 'PILOT private-reader required artifacts: POM=%s JAR=%s\n' "$pom_status" "$jar_status"
          [[ "$private_status" = 200 || "$private_status" = 404 ]]
          test "$pom_status" = 200
          test "$jar_status" = 200
          test "$zip_status" = 200
      - name: Run existing plugin QA with production-aware action
        uses: SonarSource/ci-github-actions/build-gradle@34a5cd54a008a57fb8e78ca41af265ab7cba66de
        env:
          GITHUB_TOKEN: ${{ fromJSON(steps.licenses.outputs.vault).GITHUB_TOKEN }}
        with:
          deploy: 'false'
          deploy-pull-request: 'false'
          skip-tests: 'false'
          use-develocity: 'false'
          artifactory-reader-role: private-reader
          disable-caching: 'true'
          sonar-platform: none
          gradle-args: >-
            its:plugin:integrationTest
            -Dsonar.runtimeVersion=LATEST_RELEASE
            --refresh-dependencies
            --no-build-cache
            --info
            -x sonar
            -x artifactoryPublish
      - name: Check test results and credential isolation
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, xml.etree.ElementTree as ET
          token = os.environ.get('ARTIFACTORY_ACCESS_TOKEN', '').encode()
          reports = list(pathlib.Path('its/plugin/build/test-results/integrationTest').glob('TEST-*.xml'))
          assert reports, 'Missing plugin integration-test reports'
          total = failures = errors = skipped = 0
          for path in reports:
              data = path.read_bytes()
              assert not token or token not in data, 'Reader token found in test report'
              suite = ET.fromstring(data)
              total += int(suite.get('tests', '0'))
              failures += int(suite.get('failures', '0'))
              errors += int(suite.get('errors', '0'))
              skipped += int(suite.get('skipped', '0'))
          assert total > skipped and failures == 0 and errors == 0
          print(f'PILOT plugin QA reports: tests={total}, failures={failures}, errors={errors}, skipped={skipped}; reader token absent')
          caches = list(pathlib.Path(os.environ['ORCHESTRATOR_HOME']).rglob('sonarqube-enterprise-lw-*.zip'))
          assert len(caches) == 1, 'Expected one freshly downloaded private distribution'
          cached = caches[0]
          version = cached.name.removeprefix('sonarqube-enterprise-lw-').removesuffix('.zip')
          print(f'PILOT LATEST_RELEASE resolved to {version}; fresh private ZIP {cached.name}, bytes={cached.stat().st_size}')
          PYTHON
